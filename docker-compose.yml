services:
  postgres:
    image: postgres:16-alpine
    container_name: jobboard-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard
      POSTGRES_DB: jobboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
